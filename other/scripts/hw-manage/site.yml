---
# ── 1. k3s version status (read-only audit) ─────────────────────────────────
#    Prints the latest k3s release once, then for each node whether it is on
#    that version. Never changes anything — report only, so it can never break
#    the apt maintenance that follows. Everything is failed_when: false.

- name: Report k3s version status
  hosts: k3s
  gather_facts: false
  become: false   # never sudo: this play only runs curl on localhost and `k3s --version`
                  # (which needs no root). This matters when you pass `-b` on the CLI.

  pre_tasks:
    - name: Determine the latest k3s release (best-effort, network dependent)
      ansible.builtin.shell: |-
        curl -sfL https://latest.k3s.io 2>/dev/null \
        || curl -sfL https://api.github.com/repos/k3s-io/k3s/releases/latest 2>/dev/null \
        | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+' | head -1
      register: k3s_latest
      changed_when: false
      failed_when: false
      run_once: true
      delegate_to: localhost

    - name: Print the latest k3s release
      ansible.builtin.debug:
        msg: "Latest k3s release: {{ (k3s_latest.stdout | trim) | default('<could not determine — offline?>', true) }}"
      run_once: true

  tasks:
    - name: Get the installed k3s version
      ansible.builtin.shell: |-
        k3s --version 2>/dev/null \
        | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+' | head -1
      register: k3s_installed
      changed_when: false
      failed_when: false

    - name: Report node k3s version status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {% set latest = (hostvars['localhost']['k3s_latest'].stdout | default('', true)) | trim %}
          {% set installed = (k3s_installed.stdout) | trim %}
          {% if latest == '' %}
            k3s: check skipped (latest unavailable — offline?)
          {% elif installed == '' %}
            k3s: not installed
          {% elif installed == latest %}
            k3s: up to date ({{ installed }})
          {% else %}
            k3s: OUT OF DATE — installed {{ installed }}, latest {{ latest }}
          {% endif %}

# ── 2. apt maintenance ──────────────────────────────────────────────────────

- name: apt maintenance
  hosts: k3s
  become: true
  serial: 1

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600   # skip re-running apt-get update within the last hour

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist            # full upgrade. Use "minimal" for strictly non-destructive (bare 'apt upgrade')

    - name: Remove unused dependencies
      ansible.builtin.apt:
        autoremove: true

    - name: Clean apt cache to reclaim space
      ansible.builtin.command:
        cmd: apt clean
      changed_when: false
