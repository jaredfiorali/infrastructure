---
# Per-node steps, included once per node (run serial: 1).
# Ordering: cordon -> drain -> confirm empty -> all Longhorn volumes Detached ->
#           k3sup upgrade -> (rollback on fail) -> wait Ready -> uncordon.
#
# The upgrade and the readiness-wait each live in a block whose rescue rolls the
# node back and then `fail:`s. In Ansible, a block whose rescue ends in a failing
# task stops the whole play — so the remaining nodes are never upgraded (no
# half-upgraded cluster). A rescue that instead succeeds would make the node
# "ok" and the play would carry on to the next node.

- name: Cordon the node
  command: kubectl cordon {{ inventory_hostname }}
  delegate_to: localhost
  changed_when: false

- name: Drain the node (keep daemonsets; emptydir data is ephemeral)
  command: >-
    kubectl drain {{ inventory_hostname }}
    --ignore-daemonsets --delete-emptydir-data --timeout=180s
  delegate_to: localhost

- name: Confirm no workloads remain on the node
  command: >-
    kubectl get pods -A
    --field-selector spec.nodeName={{ inventory_hostname }},status.phase!=Terminating
    -o name
  register: upgrade_remaining_pods
  delegate_to: localhost
  changed_when: false

- name: Fail if any workload is still scheduled on the node
  assert:
    that:
      - "upgrade_remaining_pods.stdout | trim == ''"
    fail_msg: >-
      {{ inventory_hostname }} was not fully drained. Stranded pods:
      {{ upgrade_remaining_pods.stdout }}
    success_msg: "{{ inventory_hostname }} drained cleanly — no workloads remain."

- name: Check for Longhorn volumes not fully detached from this node
  command: >-
    kubectl get -n longhorn-system volume
    -o jsonpath='{.items[?(@.status.nodeID=="{{ inventory_hostname }}" && @.status.state != "Detached")].metadata.name}'
  register: upgrade_detaching_volumes
  delegate_to: localhost
  changed_when: false
  failed_when: false   # CRD may be absent on clusters without Longhorn

- name: Fail if any Longhorn volume is not fully detached from this node
  assert:
    that:
      - "upgrade_detaching_volumes.rc == 0"
      - "upgrade_detaching_volumes.stdout | trim == ''"
    fail_msg: >-
      {{ inventory_hostname }} still has Longhorn volumes not detached:
      {{ upgrade_detaching_volumes.stdout | trim }}.
      Wait for them to reach Detached (or reschedule the workload), then re-run.
    success_msg: "{{ inventory_hostname }} has no Longhorn volumes attached or mid-migration."
  when: upgrade_detaching_volumes.rc == 0   # skip validation if the CRD is absent

- name: Build the k3sup upgrade command (placeholder version token)
  set_fact:
    k3sup_cmd_template: >-
      {%- set ip = hostvars[inventory_hostname].ansible_host -%}
      {%- set sip = hostvars[primary_host].ansible_host -%}
      {%- if is_primary_server -%}
      k3sup install --ip {{ ip }} --user root --k3s-version __VERSION__ --k3s-extra-args "{{ k3s_extra_args | trim }}"
      {%- elif is_master -%}
      k3sup join --ip {{ ip }} --server-ip {{ sip }} --user root --k3s-version __VERSION__ --server --server-user root --k3s-extra-args "{{ k3s_extra_args | trim }}"
      {%- else -%}
      k3sup join --ip {{ ip }} --server-ip {{ sip }} --user root --k3s-version __VERSION__
      {%- endif -%}

- name: Materialize the upgrade and rollback commands
  set_fact:
    upgrade_cmd: "{{ k3sup_cmd_template | replace('__VERSION__', upgrade_k3s_version) }}"
    rollback_cmd: "{{ k3sup_cmd_template | replace('__VERSION__', initial_k3s_version) }}"

- name: Upgrade k3s on this node (k3sup does the SSH from the Mac)
  block:
    - name: Run k3sup upgrade
      command: "{{ upgrade_cmd }}"
      register: upgrade_k3sup
      delegate_to: localhost
      environment: { STRICT_HOST_KEY_CHECKING: "no" }
      changed_when: true
      failed_when: upgrade_k3sup.rc != 0
  rescue:
    - name: Rollback this node to the recorded last-known-good version
      command: "{{ rollback_cmd }}"
      delegate_to: localhost
      environment: { STRICT_HOST_KEY_CHECKING: "no" }
      when: initial_k3s_version != ''
    - name: Uncordon the rolled-back node so it rejoins scheduling
      command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      changed_when: false
    - name: Abort — upgrade failed, node rolled back, play stopping
      fail:
        msg: >-
          k3sup upgrade failed on {{ inventory_hostname }} (rc={{ upgrade_k3sup.rc | default('unknown') }});
          rolled back to {{ initial_k3s_version }}.
          Resolve the cause on this node, then re-run the playbook.

- name: Wait for the node to report Ready in the cluster (up to ~5 min)
  block:
    - name: Poll node Ready status
      command: >-
        kubectl get node {{ inventory_hostname }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: upgrade_node_ready
      delegate_to: localhost
      changed_when: false
      retries: 30
      delay: 10
      until: upgrade_node_ready.stdout == 'True'
  rescue:
    - name: Rollback this node — it did not recover after upgrade
      command: "{{ rollback_cmd }}"
      delegate_to: localhost
      environment: { STRICT_HOST_KEY_CHECKING: "no" }
      when: initial_k3s_version != ''
    - name: Uncordon the rolled-back node so it rejoins scheduling
      command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: localhost
      changed_when: false
    - name: Abort — node did not become Ready
      fail:
        msg: >-
          {{ inventory_hostname }} never reported Ready after upgrade.
          Rolled back to {{ initial_k3s_version }}.

- name: Report Longhorn volume health (informational)
  command: "kubectl get -n longhorn-system volume -o wide"
  delegate_to: localhost
  register: upgrade_longhorn_volumes
  changed_when: false
  failed_when: false   # cluster may not have Longhorn; this is display-only

- name: Summarize Longhorn volume health
  debug:
    msg: "- Longhorn volumes on {{ inventory_hostname }}: {{ upgrade_longhorn_volumes.stdout | trim | default('(none)', true) }}"

- name: Uncordon the node
  command: kubectl uncordon {{ inventory_hostname }}
  delegate_to: localhost
  changed_when: false
