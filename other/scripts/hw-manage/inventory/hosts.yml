# Inventory for hw-manage
# Each node has: hostname, ip, role (master/worker), and node-specific settings

all:
  children:
    k3s:
      children:
        masters: {}
        workers: {}
    masters:
      hosts:
        rpi5-node-1:
          ansible_host: 192.168.20.10
        rpi5-node-2:
          ansible_host: 192.168.20.11
        rpi5-node-3:
          ansible_host: 192.168.20.12
        rpi5-node-4:
          ansible_host: 192.168.20.13
        rpi5-node-5:
          ansible_host: 192.168.20.14
    workers:
      hosts:
        rpi4-node-1:
          ansible_host: 192.168.20.2
        rpi4-node-2:
          ansible_host: 192.168.20.3
        rpi4-node-3:
          ansible_host: 192.168.20.4
        rpi4-node-4:
          ansible_host: 192.168.20.5
        rpi4-node-5:
          ansible_host: 192.168.20.6
    pi4:
      hosts:
        rpi4-node-1: {}
        rpi4-node-2: {}
        rpi4-node-3: {}
        rpi4-node-4: {}
        rpi4-node-5: {}
    pi5:
      hosts:
        rpi5-node-1: {}
        rpi5-node-2: {}
        rpi5-node-3: {}
        rpi5-node-4: {}
        rpi5-node-5: {}

  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    # Firmware upgrade settings
    firmware_channel: stable
    # Upgrade policy: best-effort for workers, sequential for masters
    upgrade_reboot: true
    upgrade_log_dir: /var/log/hw-manage
