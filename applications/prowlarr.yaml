apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fiorali: 'true'
    supabase: 'true'
  name: prowlarr
  namespace: argocd
spec:
  destination:
    namespace: downloader
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: fiorali
    helm:
      parameters:
      - name: replicaCount
        value: '2'
      valueFiles:
      - values.yaml
      - prowlarr.yaml
    repoURL: ghcr.io/jaredfiorali/helm-charts
    targetRevision: '0.3.74'
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
