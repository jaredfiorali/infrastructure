apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fiorali: 'true'
  name: metallb
  namespace: argocd
spec:
  destination:
    namespace: metallb-system
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: metallb
    helm:
      parameters:
      - name: controller.serviceAccount.name
      - name: prometheus.namespace
        value: monitoring
      - name: prometheus.serviceAccount
        value: prometheus-kube-prometheus-prometheus
      - name: prometheus.serviceMonitor.enabled
        value: 'true'
      - name: frrk8s.enabled
        value: 'true'
      - name: speaker.frr.enabled
        value: 'false'
    repoURL: https://metallb.github.io/metallb
    targetRevision: '*'
  - chart: fiorali
    helm:
      valueFiles:
      - values.yaml
      - metallb.yaml
    repoURL: ghcr.io/jaredfiorali/helm-charts
    targetRevision: '0.3.46'
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
