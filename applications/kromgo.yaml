apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fiorali: 'true'
  name: kromgo
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: fiorali
    helm:
      valueFiles:
      - values.yaml
      - kromgo.yaml
    repoURL: ghcr.io/jaredfiorali/helm-charts
    targetRevision: '*'
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
