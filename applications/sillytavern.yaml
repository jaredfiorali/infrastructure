apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    fiorali: 'true'
    longhorn-pv: 'true'
  name: sillytavern
  namespace: argocd
spec:
  destination:
    namespace: sillytavern
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: fiorali
    helm:
      valueFiles:
      - values.yaml
      - sillytavern.yaml
    repoURL: ghcr.io/jaredfiorali/helm-charts
    targetRevision: '0.3.52'
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
