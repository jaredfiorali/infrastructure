name: dawarich-redis
namespace: dawarich
deployment:
  enabled: true
replicaCount: 1
image:
  repository: docker.io/redis
  tag: 7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
containerPorts:
- containerPort: 6379
  name: redis
  protocol: TCP
resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 250m
    memory: 250Mi
probes:
  exec:
    command:
    - sh
    - -c
    - redis-cli --raw incr ping
service:
  enabled: true
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
volumeMounts:
- name: shared
  mountPath: /data
volumes:
- name: shared
  emptyDir: {}
nodeSelector: {}
tolerations: []
affinity: {}
networkpolicy:
  podSelector: true
  ingress:
    allowAll: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 999
  runAsNonRoot: true
  runAsUser: 999
prometheusRules:
  enabled: true
  rules:
  - alert: DawarichRedisDown
    expr: up{job="dawarich-redis"} == 0
    for: 1m
    labels:
      severity: critical
      component: dawarich
      namespace: monitoring
    annotations:
      summary: "Dawarich redis is down"
      description: "Dawarich redis has been down for 1+ minutes."
  - alert: DawarichRedisHighLatency
    expr: histogram_quantile(0.95, rate(redis_seconds_total[5m])) > 0.5
    for: 15m
    labels:
      severity: warning
      component: dawarich
      namespace: monitoring
    annotations:
      summary: "Dawarich redis latency high: {{ $value }}s"
      description: "Dawarich redis P95 latency has exceeded 500ms for 15+ minutes."
imageUpdater:
  enabled: true
  rootImageTag: "7-alpine"
