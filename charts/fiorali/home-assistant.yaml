name: home-assistant
namespace: home-assistant
deployment:
  enabled: true
image:
  repository: docker.io/homeassistant/home-assistant
  tag: latest@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
containerPorts:
- containerPort: 8123
  name: home-assistant
  protocol: TCP
- containerPort: 5353
  name: homekit-udp
  protocol: UDP
- containerPort: 21063
  name: homekit-tcp
  protocol: TCP
resources:
  limits:
    cpu: '1'
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1500Mi
probes:
  httpGet:
    path: /
    port: home-assistant
service:
  enabled: true
  ports:
  - name: home-assistant
    port: 8123
    protocol: TCP
    targetPort: home-assistant
  - port: 5353
    name: homekit-udp
    protocol: UDP
    targetPort: homekit-udp
  - port: 21063
    name: homekit-tcp
    protocol: TCP
    targetPort: homekit-tcp
containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: true
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - SETUID
    - SETGID
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
env:
- name: S6_READ_ONLY_ROOT
  value: "1"
- name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
  value: "1"
- name: S6_VERBOSITY
  value: "2"
ingress:
  enabled: true
hostNetwork: true
volumeMounts:
- name: home-assistant-persistent-storage
  mountPath: /config
- name: home-assistant-configmap
  mountPath: /config/configuration.yaml
  subPath: configuration.yaml
  readOnly: true
- name: tmp
  mountPath: /tmp
- name: run
  mountPath: /run
volumes:
- name: home-assistant-persistent-storage
  persistentVolumeClaim:
    claimName: home-assistant
- name: home-assistant-configmap
  configMap:
    name: home-assistant-configmap
    defaultMode: 0444
- name: tmp
  emptyDir: {}
- name: run
  emptyDir: {}
dnsPolicy: ClusterFirstWithHostNet
networkpolicy:
  ingress:
    internal: true
  egress:
    allowAll: true
serviceMonitor:
  enabled: true
  appSelector: home-assistant
  port: "home-assistant"
  path: /api/prometheus
  interval: 60s
prometheusRules:
  enabled: true
  rules:
  - alert: HighCO2Level
    expr: homeassistant_sensor_carbon_dioxide_ppm > 1000
    for: 24h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "CO2 elevated: {{ $value | printf \"%.0f\" }}ppm"
      description: "House CO2 has been above 1000ppm for 15+ minutes. Open some windows!"
  - alert: CriticalCO2Level
    expr: homeassistant_sensor_carbon_dioxide_ppm > 1500
    for: 15m
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "CO2 elevated: {{ $value | printf \"%.0f\" }}ppm"
      description: "House CO2 has been above 1500ppm for 15+ minutes. Open some windows!"
  - alert: HighVOCLevel
    expr: homeassistant_sensor_volatile_organic_compounds_parts_ppb > 2000
    for: 15m
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "VOC elevated: {{ $value | printf \"%.0f\" }}ppb"
      description: "House VOC has been above 2000ppb for 15+ minutes. Open some windows!"
  - alert: HARadonHigh
    expr: homeassistant_sensor_pool_table_radon_concentration > 400
    for: 24h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "Radon elevated: {{ $value }} Bq/m³"
      description: "Radon concentration has exceeded 400 Bq/m³ for 24+ hours. Consider mitigation."
  - alert: HARadonVeryHigh
    expr: homeassistant_sensor_pool_table_radon_concentration > 600
    for: 1h
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "Radon very high: {{ $value }} Bq/m³"
      description: "Radon concentration has exceeded 600 Bq/m³. Immediate ventilation recommended."
  - alert: HAPM25High
    expr: homeassistant_sensor_pool_table_pm2_5 > 35
    for: 6h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "PM2.5 elevated: {{ $value }} µg/m³"
      description: "PM2.5 has been above 35 µg/m³ for 6+ hours. Reduce outdoor air intake."
configMap:
  enabled: true
  valueFile: home-assistant-configmap.yaml
volume:
  enabled: true
  size: "5368709120"
imageUpdater:
  enabled: true
externalSecrets:
- name: home-assistant-credentials
  data:
  - secretKey: WEBHOOK_GARAGE_SIREN
    remoteRef:
      key: /homelab/home-assistant/WEBHOOK_GARAGE_SIREN
