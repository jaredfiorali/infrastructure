name: home-assistant
namespace: home-assistant
deployment:
  enabled: true
image:
  repository: docker.io/homeassistant/home-assistant
  tag: latest@sha256:24e541ddae5818bf8eb27898b9ba00d0c344a655aa5097e9e9bd4b19356be847
containerPorts:
- containerPort: 8123
  name: home-assistant
  protocol: TCP
- containerPort: 5353
  name: homekit-udp
  protocol: UDP
- containerPort: 21063
  name: homekit-tcp
  protocol: TCP
resources:
  limits:
    cpu: '1'
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi
probes:
  httpGet:
    path: /manifest.json
    port: home-assistant
service:
  enabled: true
  ports:
  - name: home-assistant
    port: 8123
    protocol: TCP
    targetPort: home-assistant
  - port: 5353
    name: homekit-udp
    protocol: UDP
    targetPort: homekit-udp
  - port: 21063
    name: homekit-tcp
    protocol: TCP
    targetPort: homekit-tcp
containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: true
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - SETUID
    - SETGID
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
env:
- name: S6_READ_ONLY_ROOT
  value: "1"
- name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
  value: "1"
- name: S6_VERBOSITY
  value: "2"
- name: WEBHOOK_GARAGE_SIREN
  valueFrom:
    secretKeyRef:
      name: home-assistant-credentials
      key: WEBHOOK_GARAGE_SIREN
- name: POSTGRES_CONNECTION_STRING
  valueFrom:
    secretKeyRef:
      name: home-assistant-credentials
      key: POSTGRES_CONNECTION_STRING
- name: SIREN_API_KEY
  valueFrom:
    secretKeyRef:
      name: home-assistant-credentials
      key: SIREN_API_KEY
- name: DAWARICH_API_KEY
  valueFrom:
    secretKeyRef:
      name: home-assistant-credentials
      key: DAWARICH_API_KEY
ingress:
  enabled: true
hostNetwork: true
volumeMounts:
# Ephemeral backing for /config: go2rtc-* caches, backups, logs, the old sqlite
# dbs, psnawp caches, tts/www/image/blueprints. Wiped on every pod restart.
- name: home-assistant-config
  mountPath: /config
# Persist across restarts — mounted as subPaths of the PVC so only these three
# trees survive. Everything else under /config lives on the emptyDir above.
- name: home-assistant-persistent-storage
  mountPath: /config/.storage
  subPath: .storage
- name: home-assistant-persistent-storage
  mountPath: /config/custom_components
  subPath: custom_components
- name: home-assistant-persistent-storage
  mountPath: /config/deps
  subPath: deps
# ConfigMap mounted as a directory so kubelet's ..data symlink swap propagates
# edits to automations/scripts/scenes without a pod restart.
- name: home-assistant-configmap
  mountPath: /config/cm
  readOnly: true
# configuration.yaml and secrets.yaml are entry-point files that only change on
# a restart, so they stay as subPath mounts (subPath never propagates updates).
- name: home-assistant-configmap
  mountPath: /config/configuration.yaml
  subPath: configuration.yaml
  readOnly: true
- name: home-assistant-configmap
  mountPath: /config/secrets.yaml
  subPath: secrets.yaml
  readOnly: true
- name: tmp
  mountPath: /tmp
- name: run
  mountPath: /run
volumes:
# Backing for the ephemeral part of /config.
- name: home-assistant-config
  emptyDir: {}
# Holds only .storage, custom_components and deps.
- name: home-assistant-persistent-storage
  persistentVolumeClaim:
    claimName: home-assistant
- name: home-assistant-configmap
  configMap:
    name: home-assistant-configmap
    defaultMode: 0444
- name: tmp
  emptyDir: {}
- name: run
  emptyDir: {}
dnsPolicy: ClusterFirstWithHostNet
networkpolicy:
  ingress:
    internal: true
  egress:
    allowAll: true
serviceMonitor:
  enabled: true
  appSelector: home-assistant
  port: "home-assistant"
  path: /api/prometheus
  interval: 60s
prometheusRules:
  enabled: true
  rules:
  - alert: HighCO2Level
    expr: homeassistant_sensor_carbon_dioxide_ppm > 1000
    for: 24h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "CO2 elevated: {{ $value | printf \"%.0f\" }}ppm"
      description: "House CO2 has been above 1000ppm for 15+ minutes. Open some windows!"
  - alert: CriticalCO2Level
    expr: homeassistant_sensor_carbon_dioxide_ppm > 1500
    for: 15m
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "CO2 elevated: {{ $value | printf \"%.0f\" }}ppm"
      description: "House CO2 has been above 1500ppm for 15+ minutes. Open some windows!"
  - alert: HighVOCLevel
    expr: homeassistant_sensor_volatile_organic_compounds_parts_ppb > 2000
    for: 15m
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "VOC elevated: {{ $value | printf \"%.0f\" }}ppb"
      description: "House VOC has been above 2000ppb for 15+ minutes. Open some windows!"
  - alert: HARadonHigh
    expr: homeassistant_sensor_pool_table_radon_concentration > 400
    for: 24h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "Radon elevated: {{ $value }} Bq/m³"
      description: "Radon concentration has exceeded 400 Bq/m³ for 24+ hours. Consider mitigation."
  - alert: HARadonVeryHigh
    expr: homeassistant_sensor_pool_table_radon_concentration > 600
    for: 1h
    labels:
      severity: critical
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "Radon very high: {{ $value }} Bq/m³"
      description: "Radon concentration has exceeded 600 Bq/m³. Immediate ventilation recommended."
  - alert: HAPM25High
    expr: homeassistant_sensor_pool_table_pm2_5 > 35
    for: 6h
    labels:
      severity: warning
      component: air-quality
      namespace: monitoring
    annotations:
      summary: "PM2.5 elevated: {{ $value }} µg/m³"
      description: "PM2.5 has been above 35 µg/m³ for 6+ hours. Reduce outdoor air intake."
configMap:
  enabled: true
  valueFile: home-assistant-configmap.yaml
volume:
  enabled: true
  size: "5368709120"
postsyncHomeAssistantReload:
  enabled: true
  image: curlimages/curl:latest
  # Defaults to http://home-assistant:8123/api/services/homeassistant/reload_all
  url: ""
  maxAttempts: 30
  retryDelay: 5
imageUpdater:
  enabled: true
externalSecrets:
- name: home-assistant-credentials
  data:
  - secretKey: WEBHOOK_GARAGE_SIREN
    remoteRef:
      key: /homelab/home-assistant/WEBHOOK_GARAGE_SIREN
  - secretKey: POSTGRES_CONNECTION_STRING
    remoteRef:
      key: /homelab/home-assistant/POSTGRES_CONNECTION_STRING
  - secretKey: SIREN_API_KEY
    remoteRef:
      key: /homelab/home-assistant/SIREN_API_KEY
  - secretKey: DAWARICH_API_KEY
    remoteRef:
      key: /homelab/home-assistant/DAWARICH_API_KEY
  - secretKey: HA_API_TOKEN
    remoteRef:
      key: /homelab/home-assistant/HA_API_TOKEN
