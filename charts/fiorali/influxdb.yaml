name: influxdb
namespace: monitoring
deployment:
  enabled: true
image:
  repository: docker.io/influxdb
  tag: alpine@sha256:cc8083573dc3969c191d1bfb768954eaf7a4c615af12e661034fd4f63c7b5570
containerPorts:
- containerPort: 8086
  name: influxdb
  protocol: TCP
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 125m
    memory: 512Mi
probes:
  tcpSocket:
    port: influxdb
service:
  enabled: true
  ports:
  - name: influxdb
    port: 8086
    protocol: TCP
    targetPort: influxdb
ingress:
  enabled: true
volumeMounts:
- name: influxdb-storage
  mountPath: /var/lib/influxdb2
volumes:
- name: influxdb-storage
  persistentVolumeClaim:
    claimName: influxdb
networkpolicy:
  ingress:
    internal: true
    network: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
prometheusRules:
  enabled: true
  rules:
  - alert: InfluxDBDown
    expr: up{job="influxdb"} == 0
    for: 1m
    labels:
      severity: critical
      component: influxdb
      namespace: monitoring
    annotations:
      summary: "InfluxDB is down"
      description: "InfluxDB has been down for more than 1 minute."
  - alert: InfluxDBHighDiskUsage
    expr: (influxdb_disk_usage_bytes / influxdb_disk_capacity_bytes) * 100 > 80
    for: 15m
    labels:
      severity: warning
      component: influxdb
      namespace: monitoring
    annotations:
      summary: "InfluxDB disk usage high: {{ $value }}%"
      description: "InfluxDB disk usage has exceeded 80% for 15+ minutes."
imageUpdater:
  enabled: true
  rootImageTag: "alpine"
