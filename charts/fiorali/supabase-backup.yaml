name: supabase-backup
namespace: supabase
image:
  repository: docker.io/postgres
  tag: 17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
deployment:
  enabled: false
service:
  enabled: false
podDisruptionBudget:
  enabled: false
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 125Mi
cronjob:
  enabled: true
  schedule: "0 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  restartPolicy: Never
networkpolicy:
  egress:
    allowAll: true
serviceAccount:
  enabled: true
  name: supabase-backup-serviceaccount
clusterRole:
  enabled: true
  rules:
    - apiGroups: ["", "argoproj.io"]
      resources: ["secrets", "applications"]
      verbs: ["get", "list", "watch"]

clusterRoleBinding:
  enabled: true
initContainers:
  enabled: true
  containers:
    - name: discover
      image: docker.io/alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          umask 077
          TAB="$(printf '\t')"
          : > /work/targets.tsv

          if ! kubectl get applications -A -l supabase='true' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.destination.namespace}{"\n"}{end}' \
            > /work/apps.tsv 2> /work/err.log; then
            echo "Failed to list ArgoCD applications: $(cat /work/err.log)"
            exit 1
          fi

          while IFS="$TAB" read -r app ns; do
            [ -z "$app" ] && continue
            [ -z "$ns" ] && continue
            echo "Discovering '$app' in namespace '$ns'"

            # One API call per namespace; all lookups below happen locally with jq
            if ! kubectl get secrets -n "$ns" -o json > /work/secrets.json 2> /work/err.log < /dev/null; then
              echo "  -> cannot list secrets: $(cat /work/err.log)"
              continue
            fi

            # Prefer POSTGRES_CONNECTION_STRING, favouring the conventional secret name
            url=$(jq -r --arg app "$app" '
              [.items[] | select(.data.POSTGRES_CONNECTION_STRING != null)]
              | (map(select(.metadata.name == "supabase-\($app)-database-credentials")) + .)
              | .[0].data.POSTGRES_CONNECTION_STRING // empty
              | @base64d' /work/secrets.json)

            # Fallback: build a URL from DB_* fields (credentials are URL-encoded)
            if [ -z "$url" ]; then
              url=$(jq -r --arg app "$app" '
                [.items[] | select(.data.DB_HOST != null and .data.DB_PASSWORD != null)]
                | (map(select(.metadata.name == "supabase-\($app)-database-credentials")) + .)
                | .[0].data // empty
                | "postgresql://\(.DB_USERNAME | @base64d | @uri):\(.DB_PASSWORD | @base64d | @uri)@\(.DB_HOST | @base64d):\((.DB_PORT // null) | if . then @base64d else "5432" end)/\(.DB_NAME | @base64d)"' \
                /work/secrets.json)
            fi

            rm -f /work/secrets.json

            if [ -z "$url" ]; then
              echo "  -> skipping '$app': no secret in '$ns' with POSTGRES_CONNECTION_STRING or DB_* fields"
              continue
            fi

            printf '%s\t%s\n' "$app" "$url" >> /work/targets.tsv
            echo "  -> found credentials for '$app'"
          done < /work/apps.tsv

          rm -f /work/apps.tsv /work/err.log

          if [ ! -s /work/targets.tsv ]; then
            echo "No backup targets found"
            exit 1
          fi
          echo "Discovered $(wc -l < /work/targets.tsv) target(s)"
      volumeMounts:
        - name: work
          mountPath: /work
command:
  exec: ["/bin/sh", "-c"]
  args:
    - |
      set -u
      TAB="$(printf '\t')"
      ok=0; fail=0
      while IFS="$TAB" read -r app url; do
        [ -z "$app" ] && continue
        f="/backups/${app}-$(date +%F).dump"
        echo "Backing up '$app'..."
        if pg_dump "$url" --format=custom --no-owner --no-privileges -f "$f.tmp" \
           && pg_restore --list "$f.tmp" > /dev/null; then
          mv "$f.tmp" "$f"; ok=$((ok+1))
        else
          rm -f "$f.tmp"; echo "  -> FAILED"; fail=$((fail+1))
        fi
      done < /work/targets.tsv
      rm -f /work/targets.tsv
      find /backups -name '*.dump' -mtime +90 -delete
      echo "Done: $ok succeeded, $fail failed."
      [ "$fail" -eq 0 ]
env:
- name: TZ
  value: "UTC"

volumeMounts:
- name: backups
  mountPath: /backups
- name: work
  mountPath: /work

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

volumes:
- name: backups
  persistentVolumeClaim:
    claimName: supabase-backup
- name: work
  emptyDir:
    medium: Memory

volume:
  enabled: true
  size: "5368709120"

imageUpdater:
  enabled: true
  rootImageTag: "17-alpine"
