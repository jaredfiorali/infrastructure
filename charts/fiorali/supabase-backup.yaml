name: supabase-backup
namespace: postgres
image:
  repository: docker.io/postgres
  tag: 17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
  pullPolicy: IfNotPresent
deployment:
  enabled: false
service:
  enabled: false
podDisruptionBudget:
  enabled: false
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 125Mi
cronjob:
  enabled: true
  schedule: "0 3 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  restartPolicy: Never
networkpolicy:
  egress:
    allowAll: true
serviceAccount:
  enabled: true
  name: supabase-backup-serviceaccount
clusterRole:
  enabled: true
  rules:
    - apiGroups: ["", "argoproj.io"]
      resources: ["secrets", "applications"]
      verbs: ["get", "list", "watch"]
clusterRoleBinding:
  enabled: true
initContainers:
  enabled: true
  containers:
    - name: discover
      image: docker.io/alpine/k8s:1.37.1@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 100m
          memory: 100Mi
        requests:
          cpu: 50m
          memory: 50Mi
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -u
          umask 077
          TAB="$(printf '\t')"
          : > /work/targets.tsv

          if ! kubectl get applications -A -l supabase='true' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.destination.namespace}{"\n"}{end}' \
            > /work/apps.tsv 2> /work/err.log; then
            echo "Failed to list ArgoCD applications: $(cat /work/err.log)"
            exit 1
          fi

          while IFS="$TAB" read -r app ns; do
            [ -z "$app" ] && continue
            [ -z "$ns" ] && continue
            echo "Discovering '$app' in namespace '$ns'"

            # One API call per namespace; all lookups below happen locally with jq
            if ! kubectl get secrets -n "$ns" -o json > /work/secrets.json 2> /work/err.log < /dev/null; then
              echo "  -> cannot list secrets: $(cat /work/err.log)"
              continue
            fi

            # Prefer POSTGRES_CONNECTION_STRING, favouring the conventional secret name
            url=$(jq -r --arg app "$app" '
              [.items[] | select(.data.POSTGRES_CONNECTION_STRING != null)]
              | (map(select(.metadata.name == "supabase-\($app)-database-credentials")) + .)
              | .[0].data.POSTGRES_CONNECTION_STRING // empty
              | @base64d' /work/secrets.json)

            # Fallback: build a URL from DB_* fields (credentials are URL-encoded)
            if [ -z "$url" ]; then
              url=$(jq -r --arg app "$app" '
                [.items[] | select(.data.DB_HOST != null and .data.DB_PASSWORD != null)]
                | (map(select(.metadata.name == "supabase-\($app)-database-credentials")) + .)
                | .[0].data // empty
                | "postgresql://\(.DB_USERNAME | @base64d | @uri):\(.DB_PASSWORD | @base64d | @uri)@\(.DB_HOST | @base64d):\((.DB_PORT // null) | if . then @base64d else "5432" end)/\(.DB_NAME | @base64d)"' \
                /work/secrets.json)
            fi

            rm -f /work/secrets.json

            if [ -z "$url" ]; then
              echo "  -> skipping '$app': no secret in '$ns' with POSTGRES_CONNECTION_STRING or DB_* fields"
              continue
            fi

            printf '%s\t%s\n' "$app" "$url" >> /work/targets.tsv
            echo "  -> found credentials for '$app'"
          done < /work/apps.tsv

          rm -f /work/apps.tsv /work/err.log

          if [ ! -s /work/targets.tsv ]; then
            echo "No backup targets found"
            exit 1
          fi
          echo "Discovered $(wc -l < /work/targets.tsv) target(s)"
      volumeMounts:
        - name: work
          mountPath: /work
command:
  exec: ["/bin/sh", "-c"]
  args:
    - |
      set -u
      TAB="$(printf '\t')"
      ok=0; fail=0
      while IFS="$TAB" read -r app url; do
        [ -z "$app" ] && continue
        dump="/scratch/${app}.dump"
        live="bak_${app}"
        stage="bak_${app}_new"
        echo "Syncing '$app' -> '$live'..."

        # 1) Dump the source and verify the file is readable. Nothing local is touched yet.
        if ! pg_dump "$url" --format=custom --no-owner --no-privileges \
              -f "$dump" 2> /work/err.log \
           || ! pg_restore --list "$dump" > /dev/null 2>> /work/err.log; then
          echo "  -> DUMP failed: $(cat /work/err.log)"
          rm -f "$dump"; fail=$((fail+1)); continue
        fi

        # 2) Restore into a staging database
        if ! psql -v ON_ERROR_STOP=1 --no-psqlrc -q \
              -c "DROP DATABASE IF EXISTS \"${stage}\" WITH (FORCE);" \
              -c "CREATE DATABASE \"${stage}\";" 2> /work/err.log \
           || ! pg_restore --no-owner --no-privileges --exit-on-error \
              -d "$stage" "$dump" 2>> /work/err.log; then
          echo "  -> RESTORE failed (existing '$live' left untouched): $(tail -3 /work/err.log)"
          psql --no-psqlrc -q -c "DROP DATABASE IF EXISTS \"${stage}\" WITH (FORCE);" 2> /dev/null
          rm -f "$dump"; fail=$((fail+1)); continue
        fi

        # 3) Swap: only now replace the previous copy
        if ! psql -v ON_ERROR_STOP=1 --no-psqlrc -q \
              -c "DROP DATABASE IF EXISTS \"${live}\" WITH (FORCE);" \
              -c "ALTER DATABASE \"${stage}\" RENAME TO \"${live}\";" 2> /work/err.log; then
          echo "  -> SWAP failed: $(cat /work/err.log)"
          rm -f "$dump"; fail=$((fail+1)); continue
        fi

        rm -f "$dump"
        echo "  -> '$live' updated"; ok=$((ok+1))
      done < /work/targets.tsv
      rm -f /work/targets.tsv /work/err.log
      echo "Done: $ok synced, $fail failed."
      [ "$fail" -eq 0 ]
env:
- name: TZ
  value: "UTC"
- name: HOME
  value: "/work"
- name: TMPDIR
  value: "/scratch"
- name: PGHOST
  value: "postgres.postgres"
- name: PGPORT
  value: "5432"
- name: PGUSER
  value: "postgres"
- name: PGDATABASE
  value: "postgres"
- name: PGPASSWORD
  valueFrom:
    secretKeyRef:
      name: postgres-credentials
      key: POSTGRES_PASSWORD
volumeMounts:
- name: work
  mountPath: /work
- name: scratch
  mountPath: /scratch
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
volumes:
- name: work
  emptyDir:
    medium: Memory
- name: scratch
  emptyDir:
    sizeLimit: 2Gi
imageUpdater:
  enabled: true
  rootImageTag: "17-alpine"
