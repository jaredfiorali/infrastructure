name: supabase-backup
namespace: supabase
image:
  repository: docker.io/postgres
  tag: latest@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
  pullPolicy: IfNotPresent
deployment:
  enabled: false
service:
  enabled: false
podDisruptionBudget:
  enabled: false
resources:
  limits: {}
  requests: {}
cronjob:
  enabled: true
  schedule: "0 3 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  restartPolicy: Never
serviceAccount:
  enabled: true
  name: supabase-backup-serviceaccount
resource:
  enabled: true
  clusterRole:
    apiGroups: ["", "argoproj.io"]
    resources: ["secrets", "applications"]
    verbs: ["get", "list", "watch"]
  clusterRoleBinding:
    enabled: true
command:
  exec: ["/bin/sh", "-c"]
  args:
  - |
    set -e

    # Install jq if not present
    if ! command -v jq >/dev/null 2>&1; then
      apk add --no-cache jq
    fi

    APISERVER="https://kubernetes.default.svc"
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    API_HEADER="Authorization: Bearer $TOKEN"

    echo "Discovering Supabase databases from ArgoCD Applications..."
    SUCCESSES=0
    FAILURES=0

    # List ArgoCD Apps with supabase: 'true', extract app name + destination namespace
    apps_json=$(curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      -H "$API_HEADER" \
      "$APISERVER/apis/argoproj.io/v1alpha1/applications?labelSelector=supabase%3Dtrue")

    while IFS=$'\t' read -r app_name app_ns; do
      [ -z "$app_name" ] && continue
      [ -z "$app_ns" ] && continue

      # The database secret name follows the supabase operator naming convention
      db_secret="supabase-${app_name}-database-credentials"

      # Fetch the POSTGRES_CONNECTION_STRING from the secret
      db_url_b64=$(curl -s --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
        -H "$API_HEADER" \
        "$APISERVER/api/v1/namespaces/$app_ns/secrets/$db_secret" | \
        jq -r '.data.POSTGRES_CONNECTION_STRING // empty')

      if [ -z "$db_url_b64" ]; then
        echo "Skipping '$app_name': secret '$db_secret' not found or missing POSTGRES_CONNECTION_STRING"
        continue
      fi

      db_url=$(echo "$db_url_b64" | base64 -d)
      echo "Backing up '$app_name' ($db_url)..."
      BACKUP_FILE="/backups/${app_name}-$(date +%Y-%m-%d).dump"

      if pg_dump "$db_url" --format=custom --no-owner --no-privileges -f "$BACKUP_FILE"; then
        echo "  -> $BACKUP_FILE"
        SUCCESSES=$((SUCCESSES + 1))
      else
        echo "  -> FAILED"
        FAILURES=$((FAILURES + 1))
      fi
    done < <(echo "$apps_json" | jq -r '.items[] | .metadata.name + "\t" + .spec.destination.namespace')

    # Cleanup old backups (90 days)
    find /backups -name '*.dump' -mtime +90 -delete

    echo "Done: $SUCCESSES succeeded, $FAILURES failed."
    if [ $FAILURES -gt 0 ]; then
      exit 1
    fi
    exit 0

env:
- name: TZ
  value: "UTC"

volumeMounts:
- name: backups
  mountPath: /backups
- name: tmp
  mountPath: /tmp
  subPath: tmp
- name: tmp
  mountPath: /var/log
  subPath: log
- name: apk
  mountPath: /var/cache/apk
- name: tmp
  mountPath: /lib/apk
  subPath: lib-apk
- name: tmp
  mountPath: /etc/apk
  subPath: etc-apk

volumes:
- name: backups
  persistentVolumeClaim:
    claimName: supabase-backup
- name: tmp
  emptyDir: {}
- name: apk
  emptyDir: {}

volume:
  enabled: true
  size: "5368709120"

imageUpdater:
  enabled: true
