name: supabase-backup
namespace: supabase
image:
  repository: docker.io/library/postgres
  tag: 17-alpine
  pullPolicy: IfNotPresent
deployment:
  enabled: false
service:
  enabled: false
podDisruptionBudget:
  enabled: false
resources:
  limits: {}
  requests: {}
cronjob:
  enabled: true
  schedule: "0 3 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  restartPolicy: Never
serviceAccount:
  enabled: true
  name: supabase-backup-serviceaccount
resource:
  enabled: true
  clusterRole:
    apiGroups: [""]
    resources: ["secrets", "applications"]
    verbs: ["get", "list", "watch"]
    # Also handle ArgoCD Application CRD
  clusterRoleBinding:
    enabled: true
command:
  exec: ["/bin/sh", "-c"]
  args:
  - |
    set -e

    echo "Discovering Supabase databases from ArgoCD Applications..."
    SUCCESSES=0
    FAILURES=0

    # Find ArgoCD Apps with supabase: 'true', extract app name + destination namespace
    while IFS=$'\t' read -r app_name app_ns; do
      [ -z "$app_name" ] && continue
      [ -z "$app_ns" ] && continue

      # The database secret name follows the supabase operator naming convention
      db_secret="supabase-${app_name}-database-credentials"

      # Fetch the POSTGRES_CONNECTION_STRING from the secret in the destination namespace
      db_url=$(kubectl get secret "$db_secret" -n "$app_ns" -o jsonpath='{.data.POSTGRES_CONNECTION_STRING}')
      if [ -z "$db_url" ]; then
        echo "Skipping '$app_name': secret '$db_secret' not found or missing POSTGRES_CONNECTION_STRING"
        continue
      fi

      db_url=$(echo "$db_url" | base64 -d)
      echo "Backing up '$app_name' ($db_url)..."
      BACKUP_FILE="/backups/${app_name}-$(date +%Y-%m-%d).dump"

      if pg_dump "$db_url" --format=custom --no-owner --no-privileges -f "$BACKUP_FILE"; then
        echo "  -> $BACKUP_FILE"
        SUCCESSES=$((SUCCESSES + 1))
      else
        echo "  -> FAILED"
        FAILURES=$((FAILURES + 1))
      fi
    done < <(kubectl get applications -A -l supabase='true' \
      -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.destination.namespace}{"\n"}{end}')

    # Cleanup old backups (90 days)
    find /backups -name '*.dump' -mtime +90 -delete

    echo "Done: $SUCCESSES succeeded, $FAILURES failed."
    if [ $FAILURES -gt 0 ]; then
      exit 1
    fi
    exit 0

env:
- name: TZ
  value: "UTC"

volumeMounts:
- name: backups
  mountPath: /backups
- name: tmp
  mountPath: /tmp

volumes:
- name: backups
  persistentVolumeClaim:
    claimName: supabase-backups
- name: tmp
  emptyDir: {}
