name: prometheus
namespace: monitoring
deployment:
  enabled: false
service:
  enabled: false
networkpolicy:
  enabled: false
serviceAccount:
  enabled: false
podDisruptionBudget:
  enabled: false
containerSecurityContext:
  enabled: false
externalSecrets:
- name: prometheus
  data:
  - secretKey: SLACK_API_URL
    remoteRef:
      key: /homelab/prometheus/SLACK_API_URL
