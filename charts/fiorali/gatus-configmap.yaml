config.yaml: |
  metrics: true
  web:
    panel-time-range-seconds: 86400
  alerting:
    slack:
      webhook-url: "${SLACK_WEBHOOK_URL}"
      default-alert:
        enabled: true
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Gatus check failed"
  storage:
    type: postgres
    path: "${POSTGRES_CONNECTION_STRING}"
  skip-invalid-config-update: true
  connectivity:
    checker:
      target: 192.168.21.20:80
      interval: 60s
  endpoints:
    - name: argo
      url: http://argo.fiora.li
      group: kubernetes core
      conditions: ["[STATUS] == 200"]
    - name: alloy
      url: http://alloy.fiora.li/-/ready
      group: monitoring
      conditions: ["[STATUS] == 200"]
    - name: dawarich
      url: http://dawarich.fiora.li/api/v1/health
      group: other
      conditions: ["[STATUS] == 200"]
    - name: plex
      url: http://plex.fiora.li/identity
      group: media management
      conditions: ["[STATUS] == 200"]
    - name: plex(remote)
      url: http://99.246.152.8:32400/web/index.html
      group: media management
      conditions: ["[STATUS] == 200"]
    - name: prowlarr
      url: http://prowlarr.fiora.li/ping
      group: media management
      conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]
    - name: flaresolverr
      url: http://flaresolverr.fiora.li/health
      group: media management
      conditions: ["[STATUS] == 200"]
    - name: radarr
      url: http://radarr.fiora.li/ping
      group: media management
      conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]
    - name: transmission
      url: http://transmission.fiora.li/transmission/rpc
      group: media management
      conditions: ["[STATUS] == 409"]
    - name: emulatorjs
      url: http://emulatorjs.fiora.li
      group: other
      conditions: ["[STATUS] == 200"]
    - name: home-assistant
      url: http://home-assistant.fiora.li/api/
      group: home security
      conditions: ["[STATUS] == 401"]
    - name: linkding
      url: http://linkding.fiora.li/health
      group: other
      conditions: ["[STATUS] == 200", "[RESPONSE_TIME] < 1000"]
    - name: loki
      url: http://loki.loki:3100/loki/api/v1/query?query=count_over_time({job="varlogs"}[5m])
      group: monitoring
      conditions: ["[STATUS] == 200", "[BODY].status == success"]
    - name: longhorn
      url: http://longhorn.fiora.li
      group: kubernetes core
      conditions: ["[STATUS] == 200"]
    - name: grafana-oss
      url: http://grafana-oss.fiora.li/api/health
      group: monitoring
      conditions: ["[STATUS] == 200"]
    - name: influxdb
      url: http://influxdb.fiora.li/health
      group: other
      conditions: ["[STATUS] == 200"]
    - name: kromgo
      url: http://kromgo.fiora.li
      group: monitoring
      conditions: ["[STATUS] == 200"]
    - name: prometheus
      url: http://prometheus.fiora.li/-/ready
      group: monitoring
      conditions: ["[STATUS] == 200"]
    - name: unpoller
      url: http://unpoller.fiora.li/health
      group: monitoring
      conditions: ["[STATUS] == 200"]
    - name: scrypted
      url: http://scrypted.fiora.li
      group: home security
      conditions: ["[STATUS] == 200"]
    - name: sillytavern
      url: http://sillytavern.fiora.li
      group: other
      conditions: ["[STATUS] == 401"]
    - name: speedtest
      url: http://speedtest.fiora.li
      group: other
      conditions: ["[STATUS] == 200"]
    - name: tautulli
      url: http://tautulli.fiora.li/status
      group: media management
      conditions: ["[STATUS] == 200"]
    - name: tdarr
      url: http://tdarr.fiora.li
      group: media management
      conditions: ["[STATUS] == 200"]
    - name: traefik
      url: "tcp://192.168.21.20:80"
      group: metallb
      conditions: ["[CONNECTED] == true"]
    - name: cloudflared
      url: "tcp://192.168.21.21:53"
      group: metallb
      conditions: ["[CONNECTED] == true"]
    - name: plex
      url: "tcp://192.168.21.22:32400"
