name: plex
namespace: downloader
deployment:
  enabled: true
image:
  repository: docker.io/plexinc/pms-docker
  tag: latest@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
containerPorts:
- containerPort: 32400
  name: plex
  protocol: TCP
resources:
  limits:
    cpu: '3'
    memory: 4Gi
  requests:
    cpu: '1'
    memory: 3Gi
probes:
  httpGet:
    path: /identity
    port: plex
service:
  enabled: true
  loadBalancerIP: 192.168.21.22
  ports:
  - name: plex
    port: 32400
    protocol: TCP
    targetPort: plex
  externalTrafficPolicy: Cluster
  type: LoadBalancer
env:
- name: ADVERTISE_IP
  value: http://192.168.21.22:32400/
- name: PUID
  value: "1000"
- name: PGID
  value: "1000"
- name: TZ
  value: "America/Toronto"
- name: S6_READ_ONLY_ROOT
  value: "1"
- name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
  value: "1"
- name: S6_VERBOSITY
  value: "2"
ingress:
  enabled: true
volumeMounts:
- name: plex-persistent-storage
  mountPath: /config
  subPath: config
- name: media
  mountPath: /media
  readOnly: true
- name: cache
  mountPath: /config/Library/Application Support/Plex Media Server/Cache
  subPath: cache
- name: logs
  mountPath: /config/Library/Application Support/Plex Media Server/Logs
  subPath: logs
- name: transcode
  mountPath: /transcode
  subPath: transcode
- name: tmp
  mountPath: /tmp
  subPath: tmp
- name: run
  mountPath: /run
  subPath: run
volumes:
- name: plex-persistent-storage
  persistentVolumeClaim:
    claimName: plex
- name: media
  persistentVolumeClaim:
    claimName: media
- name: tmp
  emptyDir: {}
networkpolicy:
  ingress:
    internal: true
  egress:
    internet: true
containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: true
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - SETUID
    - SETGID
    - SETPCAP
  seccompProfile:
    type: RuntimeDefault
prometheusRules:
  enabled: true
  rules:
  - alert: PlexHighRemoteLatency
    expr: gatus_results_duration_seconds{key="media-management_plex(remote)"} > 5000
    for: 10m
    labels:
      severity: warning
      component: plex
      namespace: monitoring
    annotations:
      summary: "Plex remote latency high: {{ $value | humanizeDuration }}"
      description: "External Plex check latency is above 5s."
  - alert: PlexBufferDurationHigh
    expr: fiorali_plex{event="buffer"} > 300
    for: 15m
    labels:
      severity: warning
      component: plex
      namespace: monitoring
    annotations:
      summary: "Plex buffer duration high: {{ $value }}s"
      description: "Plex has accumulated over 300s of buffer time. Playback may be stalling."
  - alert: PlexQueueBuilding
    expr: fiorali_plex{event="play_queue_size"} > 50
    for: 10m
    labels:
      severity: warning
      component: plex
      namespace: monitoring
    annotations:
      summary: "Plex play queue building up: {{ $value }} items"
      description: "The play queue has grown to {{ $value }} items. Users may be queuing too many items."
podAntiAffinity: true
imageUpdater:
  enabled: true
postsyncMetallbRestart:
  enabled: true
volume:
  enabled: true
  size: "64424509440"
