name: unifi-poller
namespace: monitoring
deployment:
  enabled: true
replicaCount: 1
strategyType: RollingUpdate
image:
  repository: ghcr.io/unpoller/unpoller
  tag: latest@sha256:368126bce83af861109e1889d19786071cbf43fc39ef42026910b9717c20a107
containerPorts:
- containerPort: 9130
  name: poller
  protocol: TCP
- containerPort: 37288
  name: web
  protocol: TCP
resources:
  limits:
    cpu: '1'
    memory: 100Mi
  requests:
    cpu: 500m
    memory: 50Mi
probes:
  httpGet:
    path: /health
    port: web
service:
  enabled: true
  ports:
  - name: poller
    port: 9130
    protocol: TCP
    targetPort: poller
  - name: web
    port: 37288
    protocol: TCP
    targetPort: web
ingress:
  enabled: true
  name: unpoller
  serviceName: unifi-poller
  portName: web
env:
- name: UP_UNIFI_DEFAULT_URL
  value: "https://192.168.24.1"
- name: UP_UNIFI_DEFAULT_USER
  value: "read-only"
- name: UP_UNIFI_DEFAULT_PASS
  valueFrom:
    secretKeyRef:
      name: unifi-credentials
      key: UP_UNIFI_DEFAULT_PASS
- name: UP_UNIFI_DEFAULT_SAVE_DPI
  value: "true"
- name: UP_INFLUXDB_DISABLE
  value: "true"
- name: UP_PROMETHEUS_DEAD_PORTS
  value: "true"
- name: UP_PROMETHEUS_HTTP_LISTEN
  value: "0.0.0.0:9130"
- name: UP_POLLER_DEBUG
  value: "true"
- name: UP_WEBSERVER_ENABLE
  value: "true"
- name: UP_WEBSERVER_HTML_PATH
  value: "/web"
- name: unifi-poller_PORT
  value: "9130"
- name: unifi-poller_TOKEN_STORE
  value: "/opt/unifi-poller/unifi-poller.store"
- name: UP_LOKI_DISABLE
  value: "true"
volumeMounts:
- name: token
  mountPath: /opt/unifi-poller
- name: web-html
  mountPath: /web
volumes:
- name: token
  emptyDir: {}
- name: web-html
  emptyDir: {}
networkpolicy:
  ingress:
    network: true
    internal: true
  egress:
    network: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
imageUpdater:
  enabled: true
externalSecrets:
- name: unifi-credentials
  data:
  - secretKey: UP_UNIFI_DEFAULT_PASS
    remoteRef:
      key: /homelab/unifi-poller/UP_UNIFI_DEFAULT_PASS
