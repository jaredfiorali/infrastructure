{{ if .Values.configMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name | default (printf "%s-configmap" .Values.name) }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
data:
  {{- if .Values.configMap.valueFile }}
  {{- $.Files.Get .Values.configMap.valueFile | nindent 2 }}
  {{- else }}
  {{- .Values.configMap.value | nindent 2 }}
  {{- end }}
{{- end }}
