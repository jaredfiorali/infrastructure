{{ range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $.Values.name }}
    external-secret: "true"
    {{- if .skipPopeye }}
    skip-popeye: "true"
    {{- end }}
    {{- if .labels }}
    {{- toYaml .labels | nindent 4 }}
    {{- end }}
spec:
  refreshInterval: {{ .refreshInterval | default "24h" }}
  secretStoreRef:
    name: {{ .secretStoreName | default "aws-ssm" }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .remoteRef.key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
