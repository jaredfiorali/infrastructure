    mode: single
  - id: '1795790200011'
    alias: Kids Routine - End
    description: Turn off kids lights at 20:00 (guest mode off) or 20:30 (guest mode on)
    triggers:
    - trigger: time
      at:
      - '20:00:00'
      - '20:30:00'
    conditions:
    - condition: jinja
      value_template: >-
        {% set t = now().strftime('%H:%M') %}{% if (t == '20:00' and states.input_boolean.alarm_guest_mode.state == 'off') or (t == '20:30' and states.input_boolean.alarm_guest_mode.state == 'on') %}true{% endif %}
