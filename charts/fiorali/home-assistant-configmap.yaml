    - condition: jinja
      value_template: >-
        {% set t = now().strftime('%H:%M') %}{% if (t == '19:30' and states.input_boolean.alarm_guest_mode.state == 'off') or (t == '20:00' and states.input_boolean.alarm_guest_mode.state == 'on') %}true{% endif %}
    actions:
    - action: input_boolean.turn_on
