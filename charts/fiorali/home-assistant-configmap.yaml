      - condition: state
        entity_id: alarm_control_panel.alarm_system
        state:
        - armed_away
        - armed_night
        - arming
    actions:
    - action: notify.jared_s_phone
      metadata: {}
      data:
        title: 'Door Left Open'
        message: >-
          {% set doors = ['binary_sensor.front_door_contact','binary_sensor.garage_door_contact','binary_sensor.side_door_contact','binary_sensor.kitchen_contact'] %}{% set open = [] %}{% for s in states.binary_sensor if s.entity_id in doors and s.state == 'on' %}{% set _ = open.append(s.entity_id) %}{% endfor %}{{ 'An outdoor door has been open 15+ minutes: ' ~ (open|join(', ')) }}
    mode: single
  - id: '1795790200003'
    alias: Alert - Indoor Air & Climate
    description: Daily 08:10 notify if indoor humidity, temperature, or CO2 is out of comfort range
    triggers:
    - trigger: time
      at: '08:10:00'
    conditions:
    - condition: jinja
      value_template: >-
        {% set L=[] %}{% for s in states.sensor %}{% if s.attributes.get('device_class')=='humidity' and 'door' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)>60 or s.state|float(0)<25) %}{% set _ = L.append(1) %}{% endif %}{% if s.attributes.get('device_class')=='carbon_dioxide' and (s.state|float(0)>1000) %}{% set _ = L.append(1) %}{% endif %}{% if s.attributes.get('device_class')=='temperature' and 'door' not in s.entity_id and 'closet' not in s.entity_id and 'grizzl_e' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)>27 or s.state|float(0)<15) %}{% set _ = L.append(1) %}{% endif %}{% endfor %}{% if L|length > 0 %}true{% endif %}
    actions:
    - action: notify.jared_s_phone
      metadata: {}
      data:
        title: 'Indoor Air & Climate'
        message: >-
          {% set L=[] %}{% for s in states.sensor %}{% if s.attributes.get('device_class')=='humidity' and 'door' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)>60) %}{% set _ = L.append('High humidity: ' ~ s.entity_id ~ ' ' ~ s.state ~ '%') %}{% endif %}{% if s.attributes.get('device_class')=='humidity' and 'door' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)<25) %}{% set _ = L.append('Low humidity: ' ~ s.entity_id ~ ' ' ~ s.state ~ '%') %}{% endif %}{% if s.attributes.get('device_class')=='temperature' and 'door' not in s.entity_id and 'closet' not in s.entity_id and 'grizzl_e' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)>27) %}{% set _ = L.append('High temp: ' ~ s.entity_id ~ ' ' ~ s.state ~ 'C') %}{% endif %}{% if s.attributes.get('device_class')=='temperature' and 'door' not in s.entity_id and 'closet' not in s.entity_id and 'grizzl_e' not in s.entity_id and 'mississauga' not in s.entity_id and (s.state|float(0)<15) %}{% set _ = L.append('Low temp: ' ~ s.entity_id ~ ' ' ~ s.state ~ 'C') %}{% endif %}{% if s.attributes.get('device_class')=='carbon_dioxide' and (s.state|float(0)>1000) %}{% set _ = L.append('High CO2: ' ~ s.entity_id ~ ' ' ~ s.state ~ 'ppm') %}{% endif %}{% endfor %}{{ L|join('\n') }}
    mode: single
  - id: '1795790200005'
    alias: Alert - EV Not Charged Overnight
    description: Morning notify if the EV charger is not plugged in (may also fire when the car is away)
    triggers:
    - trigger: time
      at: '07:00:00'
    conditions:
    - condition: jinja
      value_template: >-
        {% if states('sensor.grizzl_e_charger_pilot_state') != 'ev_connected' %}true{% endif %}
    actions:
    - action: notify.jared_s_phone
      metadata: {}
      data:
        title: 'EV Not Charged Overnight'
        message: >-
          {% if states('sensor.grizzl_e_charger_pilot_state') != 'ev_connected' %}The EV charger is not plugged in (pilot_state: {{ states('sensor.grizzl_e_charger_pilot_state') }}). The car may not have charged overnight.{% endif %}
    mode: single
