  - id: '1795790200000'
    alias: Alert - Low Battery
    description: Daily 08:00 notify if any battery sensor drops below 25%
    triggers:
    - trigger: time
      at: '08:00:00'
    conditions:
    - condition: jinja
      value_template: >-
        {% set low = [] %}{% for s in states.sensor if s.attributes.get('device_class')=='battery' and s.state not in ('unknown','unavailable') %}{% if (s.state|float(0)) < 25 %}{% set _ = low.append(1) %}{% endif %}{% endfor %}{% if low|length > 0 %}true{% endif %}
    actions:
    - action: notify.jared_s_phone
      metadata: {}
      data:
        title: 'Low Battery'
        message: >-
          {% set low = [] %}{% for s in states.sensor if s.attributes.get('device_class')=='battery' and s.state not in ('unknown','unavailable') %}{% if (s.state|float(0)) < 25 %}{% set _ = low.append(s.entity_id ~ ' ' ~ s.state ~ '%') %}{% endif %}{% endfor %}{{ ('Low battery (' ~ low|length ~ '): ' ~ (low|join(', '))) if low|length else 'All battery sensors OK' }}
    mode: single
  - id: '1795790200001'
    alias: Alert - Sensor Offline
    description: Daily 08:05 notify if a real sensor (by device class) has been offline > 1h
    triggers:
    - trigger: time
      at: '08:05:00'
    conditions:
    - condition: jinja
      value_template: >-
        {% set ago = now() - timedelta(hours=1) %}{% set off = [] %}{% for s in states if s.state in ('unavailable','unknown') and s.last_changed and s.last_changed < ago and s.attributes.get('device_class') in ['temperature','humidity','illuminance','light_level','carbon_dioxide','air_quality','aqi','battery','pm2_5','pm10','pressure','gas','smoke','co','water','motion','contact','door','window','opening','occupancy','tamper','vibration'] %}{% set _ = off.append(1) %}{% endfor %}{% if off|length > 0 %}true{% endif %}
    actions:
    - action: notify.jared_s_phone
      metadata: {}
      data:
        title: 'Sensor Offline (>1h)'
        message: >-
          {% set ago = now() - timedelta(hours=1) %}{% set off = [] %}{% for s in states if s.state in ('unavailable','unknown') and s.last_changed and s.last_changed < ago and s.attributes.get('device_class') in ['temperature','humidity','illuminance','light_level','carbon_dioxide','air_quality','aqi','battery','pm2_5','pm10','pressure','gas','smoke','co','water','motion','contact','door','window','opening','occupancy','tamper','vibration'] %}{% set _ = off.append(s.entity_id ~ ' (' ~ s.state ~ ')') %}{% endfor %}{{ off|length ~ ' sensor(s) offline >1h: ' ~ (off|join('\n')) }}
    mode: single
  - id: '1795790200002'
    alias: Alert - Door Left Open
    description: Notify if an outdoor door stays open 15 min while the system is not armed away/night
    triggers:
    - trigger: state
      entity_id:
      - binary_sensor.front_door_contact
      - binary_sensor.garage_door_contact
      - binary_sensor.side_door_contact
      - binary_sensor.kitchen_contact
