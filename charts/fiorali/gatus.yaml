name: gatus
namespace: gatus
deployment:
  enabled: true
replicaCount: 1
strategyType: RollingUpdate
image:
  repository: ghcr.io/twin/gatus
  tag: latest@sha256:d04f9cc90641cb9728fa04c635da5c290258047c91ca0d3b3a50da7be407c5cf
containerPorts:
- containerPort: 8080
  name: gatus
  protocol: TCP
resources:
  limits:
    cpu: 250m
    memory: 50Mi
  requests:
    cpu: 100m
    memory: 25Mi
probes:
  httpGet:
    path: /
    port: gatus
env:
  - name: GATUS_LOG_LEVEL
    value: WARN
initContainers:
  enabled: true
  containers:
  - name: gatus-init
    image: docker.io/alpine/curl:latest
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsUser: 911
    resources:
      limits:
        cpu: 25m
        memory: 25Mi
      requests:
        cpu: 10m
        memory: 10Mi
    env:
    - name: SLACK_WEBHOOK_URL
      valueFrom:
        secretKeyRef:
          name: gatus-credentials
          key: SLACK_WEBHOOK_URL
    - name: POSTGRES_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          name: gatus-credentials
          key: POSTGRES_CONNECTION_STRING
    command:
    - sh
    - -c
    - |
      cd /tmp
      curl -L https://github.com/a8m/envsubst/releases/download/v1.4.3/envsubst-Linux-arm64 -o envsubst
      chmod +x envsubst
      # Process all config files with environment variable substitution
      ./envsubst < /tmp/config.yaml > /config/config.yaml
      echo "Config files processed successfully"
      echo "Processed files:"
      ls -la /config/config.yaml
    volumeMounts:
    - name: config
      mountPath: /config
    - name: tmp
      mountPath: /tmp
    - name: gatus-configmap
      mountPath: /tmp/config.yaml
      subPath: config.yaml
      readOnly: true
service:
  enabled: true
  ports:
  - name: gatus
    port: 8080
    protocol: TCP
    targetPort: gatus
volumeMounts:
- name: config
  mountPath: /config
volumes:
- name: config
  emptyDir: {}
- name: tmp
  emptyDir: {}
- name: gatus-configmap
  configMap:
    name: gatus-configmap
    defaultMode: 511
networkpolicy:
  ingress:
    internal: true
  egress:
    allowAll: true # For env substitution and Slack alerting
ingress:
  enabled: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - NET_RAW
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
imageUpdater:
  enabled: true
externalSecrets:
- name: gatus-credentials
  data:
  - secretKey: SLACK_WEBHOOK_URL
    remoteRef:
      key: /homelab/gatus/SLACK_WEBHOOK_URL
  - secretKey: POSTGRES_CONNECTION_STRING
    remoteRef:
      key: /homelab/gatus/POSTGRES_CONNECTION_STRING
serviceMonitor:
  enabled: true
  appSelector: gatus
  port: "gatus"
  interval: "5m"
prometheusRules:
  enabled: true
  rules:
  - alert: GatusEndpointStale
    expr: time() - max(gatus_results_duration_seconds > 0) > 600
    for: 5m
    labels:
      severity: warning
      component: gatus
      namespace: monitoring
    annotations:
      summary: "Gatus endpoints stale"
      description: "Some Gatus endpoints haven't responded in 10+ minutes."
    repeat_interval: 24h
  - alert: GatusHighFailureRate
    expr: sum(increase(gatus_results_total{success="false"}[1h])) / sum(increase(gatus_results_total[1h])) > 0.1
    for: 15m
    labels:
      severity: warning
      component: gatus
      namespace: monitoring
    annotations:
      summary: "Gatus failure rate: {{ $value | humanizePercentage }}"
      description: "More than 10% of Gatus endpoint checks have failed in the last hour."
    repeat_interval: 24h
configMap:
  enabled: true
  valueFile: gatus-configmap.yaml
