name: loki
namespace: loki
# Override for Grafana Loki Helm chart
# See /Users/jared/Documents/infrastructure/charts/fiorali/values.yaml for default values

# Deployment mode: SingleBinary (reduced resource footprint)
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "2Gi"
    limits:
      memory: "4Gi"
  extraVolumes:
    - name: loki-tmpfs
      emptyDir:
        medium: Memory
        sizeLimit: "2Gi"
  extraVolumeMounts:
    - name: loki-tmpfs
      mountPath: /tmp/loki

# Disable all backend components (not needed in SingleBinary mode)
backend:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
compactor:
  replicas: 0
distributor:
  replicas: 0
indexGateway:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Gateway configuration
gateway:
  service:
    type: ClusterIP

# Ingress
ingress:
  enabled: true
  hosts:
    - loki.fiora.li
  paths:
    querier:
      - /api/prom
      - /loki/api/v1
      - /ready
  pathType: Prefix

# Loki schema config
schemaConfig:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        period: "24h"
        prefix: loki_index_
      store: tsdb

# Storage configuration
storage:
  type: filesystem
  type_config: {}
storage_config:
  filesystem:
    directory: /tmp/loki/chunks
  tsdb_shipper:
    active_index_directory: /tmp/loki/index
    cache_location: /tmp/loki/index_cache

# Ingester config
ingester:
  chunk_encoding: zstd
  chunk_idle_period: 2h
  chunk_target_size: 1572864  # ~1.5MB
  lifecycler:
    ring:
      kvstore:
        store: inmemory
  wal:
    enabled: true
    dir: /tmp/loki/wal
    max_duration: "2h"

# Common config
commonConfig:
  replication_factor: 1

# Query range (results cache)
queryRange:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

# Querier config
querier:
  max_concurrent: 4
  tail_max_duration: 24h

# Limits config
limits_config:
  max_streams_per_user: 5000
  max_concurrent_tail_requests: 15
  retention_period: 48h
  allow_structured_metadata: true
  volume_enabled: true

# Compactor config
compactor:
  compaction_interval: 2h
  delete_request_store: filesystem
  delete_request_store_key_prefix: delete-requests/
  retention_enabled: true
  working_directory: /tmp/loki/compactor

# Pattern ingester
pattern_ingester:
  enabled: true

# Loki canary (monitoring)
lokiCanary:
  enabled: true

# Test
test:
  enabled: false

# Analytics
analytics:
  reporting_enabled: false

# Auth
auth_enabled: false

# Server
server:
  log_level: info
  grpc_server_max_recv_msg_size: 4194304
  grpc_server_max_send_msg_size: 4194304

# Chunks cache
chunksCache:
  enabled: true
  allocatedMemory: "1024"

# Service account
serviceAccount:
  create: true
  name: loki

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policy
networkpolicy:
  podSelector: false
  ingress:
    internal: true
    namespaces:
      - monitoring
      - gatus
  egress:
    internal: true
    kubeApiServer: true
