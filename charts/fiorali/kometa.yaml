name: kometa
namespace: downloader
image:
  repository: docker.io/kometateam/kometa
  tag: latest@sha256:0309e3975174d93a02f7a33f918a49875bcf623f87ac539390b3450532781bbf
deployment:
  enabled: false
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 125Mi
service:
  enabled: false
podDisruptionBudget:
  enabled: false
command:
  args: ["--run", "-read-only-config"]
cronjob:
  enabled: true
  schedule: "35 2 * * *"
volumeMounts:
- name: config
  mountPath: /config
- name: kometa-configmap
  mountPath: /config/movies.yml
  subPath: movies.yml
  readOnly: true
- name: kometa-configmap
  mountPath: /config/tv.yml
  subPath: tv.yml
  readOnly: true
- name: kometa-configmap
  mountPath: /config/config.yml
  subPath: config.yml
  readOnly: true
volumes:
- name: config
  emptyDir: {}
- name: kometa-configmap
  configMap:
    name: kometa-configmap
    defaultMode: 511
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
networkpolicy:
  egress:
    internet: true
    namespaces: [tautulli]
imageUpdater:
  enabled: true
env:
- name: KOMETA_READ_ONLY_CONFIG
  value: "true"
- name: KOMETA_PLEXTOKEN
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: PLEX_TOKEN
- name: KOMETA_TMDBAPIKEY
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: TMDB_APIKEY
- name: KOMETA_TAUTULLIAPIKEY
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: TAUTULLI_APIKEY
- name: KOMETA_RADARRTOKEN
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: RADARR_TOKEN
- name: KOMETA_SONARRTOKEN
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: SONARR_TOKEN
- name: KOMETA_MDBLISTAPIKEY
  valueFrom:
    secretKeyRef:
      name: kometa-api-credentials
      key: MDBLIST_APIKEY
externalSecrets:
- name: kometa-api-credentials
  data:
  - secretKey: PLEX_TOKEN
    remoteRef:
      key: /homelab/kometa/PLEX_TOKEN
  - secretKey: TMDB_APIKEY
    remoteRef:
      key: /homelab/kometa/TMDB_APIKEY
  - secretKey: TAUTULLI_APIKEY
    remoteRef:
      key: /homelab/kometa/TAUTULLI_APIKEY
  - secretKey: RADARR_TOKEN
    remoteRef:
      key: /homelab/kometa/RADARR_TOKEN
  - secretKey: SONARR_TOKEN
    remoteRef:
      key: /homelab/kometa/SONARR_TOKEN
  - secretKey: MDBLIST_APIKEY
    remoteRef:
      key: /homelab/kometa/MDBLIST_APIKEY
configMap:
  enabled: true
  valueFile: kometa-configmap.yaml
prometheusRules:
  enabled: true
  rules:
  - alert: KometaStale
    expr: time() - kube_job_status_completion_time{job_name=~"kometa-.*",succeeded="1"} > 108000
    for: 5m
    labels:
      severity: warning
      component: kometa
      namespace: monitoring
    annotations:
      summary: "Kometa has not run in {{ $value | humanizeDuration }}"
      description: "Kometa hasn't completed a successful run in 30+ hours."
  - alert: KometaFailed
    expr: kube_job_status_failed{job_name=~"kometa-.*"} > 0
    for: 5m
    labels:
      severity: critical
      component: kometa
      namespace: monitoring
    annotations:
      summary: "Kometa job failed"
      description: "A Kometa job has failed. Check the job logs."
