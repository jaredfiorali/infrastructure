name: alloy
namespace: loki
deployment:
  enabled: false
service:
  enabled: false
networkpolicy:
  enabled: false
serviceAccount:
  enabled: false
podDisruptionBudget:
  enabled: false
ingress:
  enabled: false
containerSecurityContext:
  enabled: false
configMap:
  enabled: true
  value: |-
    config.alloy: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Loki write endpoint
      loki.write "fiorali" {
        endpoint {
          url       = "http://loki-gateway.loki/loki/api/v1/push"
          tenant_id = "fiorali"
        }
      }

      // Kubernetes discovery (Filtering to only this Node)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(env("HOSTNAME"), constants.hostname)
        }
      }

      // Map standard labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // Stream logs via Kubernetes API — handles rotation, symlinks, path construction natively
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        forward_to = [loki.write.fiorali.receiver]

        // Drop noisy scrypted heartbeat lines before any other processing
        stage.match {
          selector      = "{container=\"scrypted\"}"
          pipeline_name = "scrypted_noise_filter"

          stage.drop {
            expression          = "motionDetected: (true|false)|rebroadcast clients: \\d+"
            drop_counter_reason = "scrypted_noise"
          }
        }

        // Strip ANSI color codes some apps emit when run interactively/in a TTY
        stage.decolorize {}

        // Branch 1: JSON-looking lines
        stage.match {
          selector      = "{namespace=~\".+\"}"
          pipeline_name = "json_logs"

          stage.regex {
            expression = "^\\s*\\{"
          }
          stage.json {
            expressions = {
              level     = "level",
              message   = "message",
              timestamp = "time",
            }
          }
        }

        // Branch 2: logfmt-looking lines (key=value pairs, common for Go apps)
        stage.match {
          selector      = "{namespace=~\".+\"}"
          pipeline_name = "logfmt_logs"

          stage.regex {
            expression = "^\\S+=\\S+"
          }
          stage.logfmt {
            mapping = {
              level     = "level",
              message   = "msg",
              timestamp = "time",
            }
          }
        }

        // Fallback: grab a leading level token from plain-text lines that didn't
        // match either branch above, e.g. "2026-09-17T09:00:00 ERROR something broke"
        stage.regex {
          expression = "(?i)(?P<level>trace|debug|info|warn(?:ing)?|error|fatal|panic)"
        }

        // Normalize casing/values so level doesn't fragment into extra streams
        stage.template {
          source   = "level"
          template = "{{ ToLower .Value }}"
        }

        // Use the extracted timestamp when we have one, instead of ingestion time
        stage.timestamp {
          source = "timestamp"
          format = "RFC3339"
        }

        stage.labels {
          values = {
            level = "level",
          }
        }

        stage.static_labels {
          values = {
            cluster     = "default",
            environment = "prod",
          }
        }
      }
