name: kromgo
namespace: monitoring
deployment:
  enabled: true
replicaCount: 2
strategyType: RollingUpdate
image:
  repository: ghcr.io/kashalls/kromgo
  tag: latest@sha256:965ecc92d68dc1a4a969397855367bbc70da03227a941ea607b73bb7e0b78fd6
containerPorts:
- containerPort: 8080
  name: kromgo
  protocol: TCP
- containerPort: 8888
  name: healthz
  protocol: TCP
resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 250m
    memory: 250Mi
probes:
  httpGet:
    path: /healthz
    port: healthz
service:
  enabled: true
  ports:
  - name: kromgo
    port: 8080
    protocol: TCP
    targetPort: kromgo
env:
- name: PROMETHEUS_URL
  value: "http://prometheus-kube-prometheus-prometheus:9090"
ingress:
  enabled: true
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
networkpolicy:
  ingress:
    internal: true
volumeMounts:
- name: kromgo-configmap
  mountPath: /kromgo/config.yaml
  subPath: config.yaml
  readOnly: true
volumes:
- name: kromgo-configmap
  configMap:
    name: kromgo-configmap
    defaultMode: 511
imageUpdater:
  enabled: true
configMap:
  enabled: true
  valueFile: kromgo-configmap.yaml
