name: grafana-oss
namespace: monitoring
deployment:
  enabled: false
replicaCount: 0
networkpolicy:
  enabled: false
podDisruptionBudget:
  enabled: false
service:
  enabled: false
serviceAccount:
  enabled: false
grafana:
  enabled: true
  url: http://grafana-oss.monitoring
  userName: grafana-oss
  userKey: ADMIN_USER
  passwordName: grafana-oss
  passwordKey: ADMIN_PASSWORD
  instanceLabel: grafana-oss
  repository:
    enabled: true
  serviceAccount:
    name: "git-sync"
    role: "Admin"
    token:
      name: "git-sync"
      secretName: "git-sync"
  datasources:
    - resourceName: prometheus
      uid: bf97cjlrdkkxsb
      name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-kube-prometheus-prometheus:9090
      isDefault: true
    - resourceName: loki
      uid: ef97fhyk0nfuoc
      name: loki
      type: loki
      access: proxy
      url: http://loki-gateway.loki
    - resourceName: alertmanager
      uid: df97fkv0rs16of
      name: alertmanager
      type: alertmanager
      access: proxy
      url: http://prometheus-kube-prometheus-alertmanager:9093
      jsonData:
        implementation: prometheus
    - resourceName: influxdb-home-assistant
      uid: ffcflxi88lq80c
      name: Home Assistant
      type: influxdb
      access: proxy
      url: http://influxdb.monitoring:8086
      jsonData:
        dbName: home_assistant
        httpHeaderName1: Authorization
        httpMode: GET
        tlsSkipVerify: true
      secureJsonData:
        httpHeaderValue1: "${GRAFANA_DATASOURCE_INFLUXDB_HOME_ASSISTANT}"
      valuesFrom:
        - targetPath: "secureJsonData.httpHeaderValue1"
          secretName: grafana-oss
          secretKey: GRAFANA_DATASOURCE_INFLUXDB_HOME_ASSISTANT
    - resourceName: influxdb-personal
      uid: cf97esvx41ssgf
      name: Personal
      type: influxdb
      access: proxy
      url: http://influxdb.monitoring:8086
      jsonData:
        dbName: personal
        httpHeaderName1: Authorization
        httpMode: GET
        tlsSkipVerify: true
      secureJsonData:
        httpHeaderValue1: "${GRAFANA_DATASOURCE_INFLUXDB_PERSONAL}"
      valuesFrom:
        - targetPath: "secureJsonData.httpHeaderValue1"
          secretName: grafana-oss
          secretKey: GRAFANA_DATASOURCE_INFLUXDB_PERSONAL
externalSecrets:
- name: grafana-oss
  data:
  - secretKey: ADMIN_USER
    remoteRef:
      key: /homelab/grafana-oss/ADMIN_USER
  - secretKey: ADMIN_PASSWORD
    remoteRef:
      key: /homelab/grafana-oss/ADMIN_PASSWORD
  - secretKey: GRAFANA_DATASOURCE_INFLUXDB_PERSONAL
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_DATASOURCE_INFLUXDB_PERSONAL
  - secretKey: GRAFANA_DATASOURCE_INFLUXDB_HOME_ASSISTANT
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_DATASOURCE_INFLUXDB_HOME_ASSISTANT
  - secretKey: GRAFANA_GIT_SYNC_TOKEN
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_GIT_SYNC_TOKEN
  - secretKey: GRAFANA_GIT_SYNC_APP_ID
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_GIT_SYNC_APP_ID
  - secretKey: GRAFANA_GIT_SYNC_INSTALLATION_ID
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_GIT_SYNC_INSTALLATION_ID
  - secretKey: GRAFANA_GIT_SYNC_PRIVATE_KEY
    remoteRef:
      key: /homelab/grafana-oss/GRAFANA_GIT_SYNC_PRIVATE_KEY
alertmanagerConfig:
  receivers:
  - name: slack-critical
    slackConfigs:
    - channel: '#jared-notifications'
      iconEmoji: ':rotating_light:'
      sendResolved: true
      text: |
        {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
          *Description:* {{ .Annotations.description }}
          *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:>
        {{ end }}
  - name: slack-default
    slackConfigs:
    - channel: '#jared-notifications'
      iconEmoji: ':bell:'
      sendResolved: true
      text: |
        {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
          *Description:* {{ .Annotations.description }}
          *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:>
        {{ end }}
  route:
    receiver: slack-default
    groupBy:
    - severity
    - job
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 24h
    routes:
    - matchers:
      - name: severity
        value: critical
      receiver: slack-critical
prometheusRules:
  enabled: true
  rules:
  - alert: HighPodRestartRate
    expr: rate(kube_pod_container_status_restarts_total[1h]) * 3600 > 3
    for: 10m
    labels:
      severity: warning
      component: kubernetes
      namespace: monitoring
    annotations:
      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently ({{ $value }} restarts/hr)"
      description: "Pod has been restarting more than 3 times per hour for 10+ minutes."
  - alert: NodeNotReady
    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
    for: 5m
    labels:
      severity: critical
      component: kubernetes
      namespace: monitoring
    annotations:
      summary: "Node {{ $labels.node }} is not ready"
      description: "The node has been in NotReady state for 5+ minutes."
  - alert: NodeDiskPressure
    expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
    for: 5m
    labels:
      severity: critical
      component: kubernetes
      namespace: monitoring
    annotations:
      summary: "Node {{ $labels.node }} under disk pressure"
      description: "Node has disk pressure for 5+ minutes."
  - alert: PDBViolation
    expr: kube_pod_disruption_budget_violations > 0
    for: 5m
    labels:
      severity: warning
      component: kubernetes
      namespace: monitoring
    annotations:
      summary: "PDB violation detected"
      description: "A PodDisruptionBudget has been violated."
  - alert: PrometheusEngineLatencyHigh
    expr: histogram_quantile(0.95, rate(prometheus_engine_query_duration_seconds_bucket{slice="inner_eval"}[24h])) > 0.15
    for: 15m
    labels:
      severity: warning
      component: prometheus
      namespace: monitoring
    annotations:
      summary: "Prometheus engine latency high: {{ $value }}s"
      description: "Prometheus P95 query latency is above 150ms for 15+ minutes."
  - alert: PrometheusSeriesCountHigh
    expr: prometheus_tsdb_head_series > 1000000
    for: 15m
    labels:
      severity: warning
      component: prometheus
      namespace: monitoring
    annotations:
      summary: "Prometheus series count high: {{ $value }}"
      description: "Prometheus has more than 1M active series."
  - alert: ExternalSecretStale
    expr: time() - max(externalsecret_status_condition{status="True", condition="Ready"} != 1) > 3600
    for: 30m
    labels:
      severity: warning
      component: external-secrets
      namespace: monitoring
    annotations:
      summary: "ExternalSecret is stale"
      description: "An ExternalSecret has not synced in 1+ hours."
  - alert: ArgoCDAppCrashLooping
    expr: rate(argo_rollouts_rollout_status_phase{phase="CrashLooping"}[1h]) * 3600 > 0
    for: 10m
    labels:
      severity: warning
      component: argocd
      namespace: monitoring
    annotations:
      summary: "ArgoCD app crash looping"
      description: "ArgoCD application is crash looping."
  - alert: ArgoCDApplicationProgressingSlow
    expr: time() - max(argocd_app_info{status="progressing"}) > 3600
    for: 30m
    labels:
      severity: warning
      component: argocd
      namespace: monitoring
    annotations:
      summary: "ArgoCD app progressing slowly"
      description: "An ArgoCD application has been in 'progressing' state for 1+ hours."
