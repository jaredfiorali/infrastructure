name: romm
namespace: romm
deployment:
  enabled: true
replicaCount: 1
image:
  repository: docker.io/rommapp/romm
  tag: latest@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
containerPorts:
  - containerPort: 8080
    name: romm
    protocol: TCP
resources:
  limits:
    cpu: '1'
    memory: 2G
  requests:
    cpu: 100m
    memory: 1Gi
probes:
  httpGet:
    path: /api/heartbeat
    port: romm
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 30
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 120
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 5
containerSecurityContext:
  enabled: false
service:
  enabled: true
  ports:
    - name: romm
      port: 8080
      protocol: TCP
      targetPort: romm
env:
  # Kubernetes auto-injects ROMM_PORT=tcp://<clusterip>:8080 for the `romm`
  # service (service-discovery env vars). RomM feeds this raw value into the
  # bundled nginx `listen` directive, where the tcp:// scheme is invalid and
  # crashes nginx on startup. Override it with the bare port RomM expects
  # (its default is 8080). Explicit container env vars win over the injected ones.
  - name: ROMM_PORT
    value: '8080'
  - name: ROMM_DB_DRIVER
    value: postgresql
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_HOST
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_NAME
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_USERNAME
  - name: DB_PASSWD
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_PASSWORD
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_PORT
  - name: DB_POOL_RECYCLE_SECONDS
    value: '180'
  - name: DISABLE_USERPASS_LOGIN
    value: 'true'
  # --- Redis/Valkey: external instance, required for multi-replica pubsub ---
  - name: REDIS_HOST
    value: romm-redis
  - name: REDIS_PORT
    value: '6379'
  # --- Behaviour ---
  - name: SCAN_WORKERS
    value: '4'
  - name: WEB_SERVER_CONCURRENCY
    value: '4'
  # Required secret key for JWT session/auth signing (openssl rand -hex 32).
  - name: ROMM_AUTH_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: romm-auth
        key: ROMM_AUTH_SECRET_KEY
  # --- Optional: public URL once the ingress route is confirmed (needed for
  #      correct asset URLs and OIDC/OAuth redirects). Leave unset until then. ---
  # - name: ROMM_BASE_URL
  #   value: https://romm.fiora.li
  # --- Metadata provider keys (populated via the `romm-metadata` external secret) ---
  # IGDB is the primary source: box art, descriptions, ratings, release dates.
  # Get a free Twitch developer app at https://dev.twitch.tv/settings/apps
  - name: IGDB_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: romm-metadata
        key: IGDB_CLIENT_ID
  - name: IGDB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: romm-metadata
        key: IGDB_CLIENT_SECRET
  # SteamGridDB complements IGDB with higher-quality grid/logo art where IGDB is thin.
  # Free API key at https://www.steamgodb.com/accounts/settings/updates
  # - name: STEAMGRIDDB_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: romm-metadata
  #       key: STEAMGRIDDB_API_KEY
  # Optional extras (uncomment if desired):
  # - name: HASHEOUS_API_ENABLED
  #   value: 'true'
  # - name: RETROACHIEVEMENTS_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: romm-metadata
  #       key: RETROACHIEVEMENTS_API_KEY
  # - name: SCREENSCRAPER_USER
  #   valueFrom:
  #     secretKeyRef:
  #       name: romm-metadata
  #       key: SCREENSCRAPER_USER
  # - name: SCREENSCRAPER_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: romm-metadata
  #       key: SCREENSCRAPER_PASSWORD
volumeMounts:
  # ROMs library (read-only: RomM stores metadata in Postgres, not on the library).
  # Reuses the existing `roms` volume that emulatorjs also reads.
  - name: library
    mountPath: /romm/library
    readOnly: true
  # IGDB covers/screenshots fetched at scan time (multi-writer with RWM).
  - name: romm-persistent-storage
    mountPath: /romm/resources
    subPath: resources
  # Uploaded saves/states (multi-writer with RWM).
  - name: romm-persistent-storage
    mountPath: /romm/assets
    subPath: assets
  - name: tmp
    mountPath: /tmp
  - name: run
    mountPath: /run
volumes:
  - name: library
    persistentVolumeClaim:
      claimName: roms
  - name: romm-persistent-storage
    persistentVolumeClaim:
      claimName: romm
  - name: tmp
    emptyDir: {}
  - name: run
    emptyDir: {}
ingress:
  enabled: true
  name: romm
  portName: romm
nodeSelector: {}
tolerations: []
affinity: {}
networkpolicy:
  podSelector: true
  ingress:
    allowAll: true
  # RomM calls metadata APIs (IGDB, SteamGridDB, Screenscraper, RetroAchievements).
  egress:
    internet: true
imageUpdater:
  enabled: true
  rootImageTag: "latest"
externalSecrets:
  - name: romm-postgres-credentials
    data:
      - secretKey: DB_HOST
        remoteRef:
          key: /homelab/romm/DB_HOST
      - secretKey: DB_NAME
        remoteRef:
          key: /homelab/romm/DB_NAME
      - secretKey: DB_USERNAME
        remoteRef:
          key: /homelab/romm/DB_USERNAME
      - secretKey: DB_PASSWORD
        remoteRef:
          key: /homelab/romm/DB_PASSWORD
      - secretKey: DB_PORT
        remoteRef:
          key: /homelab/romm/DB_PORT
  - name: romm-auth
    data:
      - secretKey: ROMM_AUTH_SECRET_KEY
        remoteRef:
          key: /homelab/romm/ROMM_AUTH_SECRET_KEY
  - name: romm-metadata
    data:
      - secretKey: IGDB_CLIENT_ID
        remoteRef:
          key: /homelab/romm/IGDB_CLIENT_ID
      - secretKey: IGDB_CLIENT_SECRET
        remoteRef:
          key: /homelab/romm/IGDB_CLIENT_SECRET
      # - secretKey: STEAMGRIDDB_API_KEY
      #   remoteRef:
      #     key: /homelab/romm/STEAMGRIDDB_API_KEY
