name: romm
namespace: romm
deployment:
  enabled: true
replicaCount: 1
image:
  repository: docker.io/rommapp/romm
  tag: latest@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
containerPorts:
  - containerPort: 8080
    name: romm
    protocol: TCP
resources:
  limits:
    cpu: '2'
    memory: 2G
  requests:
    cpu: 100m
    memory: 1Gi
probes:
  httpGet:
    path: /api/heartbeat
    port: romm
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 30
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 120
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 5
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  privileged: false
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
service:
  enabled: true
  ports:
    - name: romm
      port: 8080
      protocol: TCP
      targetPort: romm
env:
  - name: ROMM_PORT
    value: '8080'
  - name: ROMM_DB_DRIVER
    value: postgresql
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_HOST
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_NAME
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_USERNAME
  - name: DB_PASSWD
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_PASSWORD
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: romm-postgres-credentials
        key: DB_PORT
  - name: DB_POOL_RECYCLE_SECONDS
    value: '180'
  - name: DISABLE_USERPASS_LOGIN
    value: 'true'
  - name: REDIS_HOST
    value: romm-redis
  - name: REDIS_PORT
    value: '6379'
  - name: SCAN_WORKERS
    value: '4'
  - name: WEB_SERVER_CONCURRENCY
    value: '4'
  - name: ROMM_AUTH_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: romm-auth
        key: ROMM_AUTH_SECRET_KEY
  - name: IGDB_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: romm-metadata
        key: IGDB_CLIENT_ID
  - name: IGDB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: romm-metadata
        key: IGDB_CLIENT_SECRET
volumeMounts:
  - name: romm-nfs
    mountPath: /romm/library
    readOnly: true
  - name: romm-persistent-storage
    mountPath: /romm/resources
    subPath: resources
  - name: romm-persistent-storage
    mountPath: /romm/assets
    subPath: assets
  - name: tmp
    mountPath: /tmp
  - name: run
    mountPath: /run
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d/
volumes:
  - name: romm-nfs
    persistentVolumeClaim:
      claimName: romm-nfs
  - name: romm-persistent-storage
    persistentVolumeClaim:
      claimName: romm
  - name: tmp
    emptyDir: {}
  - name: run
    emptyDir: {}
  - name: nginx-conf
    emptyDir: {}
ingress:
  enabled: true
  name: romm
  portName: romm
nodeSelector: {}
tolerations: []
affinity: {}
networkpolicy:
  podSelector: true
  ingress:
    allowAll: true
  # RomM calls metadata APIs (IGDB, SteamGridDB, Screenscraper, RetroAchievements).
  egress:
    internet: true
imageUpdater:
  enabled: true
  rootImageTag: "latest"
externalSecrets:
  - name: romm-postgres-credentials
    data:
      - secretKey: DB_HOST
        remoteRef:
          key: /homelab/romm/DB_HOST
      - secretKey: DB_NAME
        remoteRef:
          key: /homelab/romm/DB_NAME
      - secretKey: DB_USERNAME
        remoteRef:
          key: /homelab/romm/DB_USERNAME
      - secretKey: DB_PASSWORD
        remoteRef:
          key: /homelab/romm/DB_PASSWORD
      - secretKey: DB_PORT
        remoteRef:
          key: /homelab/romm/DB_PORT
  - name: romm-auth
    data:
      - secretKey: ROMM_AUTH_SECRET_KEY
        remoteRef:
          key: /homelab/romm/ROMM_AUTH_SECRET_KEY
  - name: romm-metadata
    data:
      - secretKey: IGDB_CLIENT_ID
        remoteRef:
          key: /homelab/romm/IGDB_CLIENT_ID
      - secretKey: IGDB_CLIENT_SECRET
        remoteRef:
          key: /homelab/romm/IGDB_CLIENT_SECRET
