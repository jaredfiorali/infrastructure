name: transmission
namespace: downloader
deployment:
  enabled: true
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
replicaCount: 1
image:
  repository: docker.io/linuxserver/transmission
  tag: latest@sha256:ebefa8cb3e36a8ce667b7739f51b86c24e9fd07f367e9fee9f21df48ea4e6542
containerPorts:
- containerPort: 9091
  name: transmission
resources:
  limits:
    cpu: 1500m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi
probes:
  exec:
    command:
    - sh
    - -c
    - if [[ $(pgrep transmission | wc -l) -ne 1 ]]; then exit 1; fi
service:
  enabled: true
  ports:
  - port: 9091
    name: transmission
    targetPort: transmission
env:
- name: PUID
  value: "1000"
- name: PGID
  value: "1000"
- name: TZ
  value: "America/Toronto"
- name: S6_READ_ONLY_ROOT
  value: "1"
- name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
  value: "1"
- name: S6_VERBOSITY
  value: "2"
ingress:
  enabled: true
volumeMounts:
- name: media
  mountPath: /media
- name: config
  mountPath: /config
- name: run
  mountPath: /run
volumes:
- name: transmission-configmap
  configMap:
    name: transmission-configmap
    defaultMode: 511
- name: media
  persistentVolumeClaim:
    claimName: media
- name: port-forward
  emptyDir: {}
- name: config
  emptyDir: {}
- name: run
  emptyDir: {}
networkpolicy:
  ingress:
    internal: true
  egress:
    internet: true
initContainers:
  enabled: true
  containers:
  - name: gluetun
    image: docker.io/qmcgaw/gluetun:latest@sha256:6a59b7901068b7c50ef52200152db3afd4b9cebc13e272b2169de4cdcad91006
    resources:
      limits:
        cpu: 1500m
        memory: 1Gi
      requests:
        cpu: 1000m
        memory: 500Mi
    imagePullPolicy: IfNotPresent
    restartPolicy: Always
    securityContext:
      privileged: true
      capabilities:
        add:
        - NET_ADMIN
    startupProbe:
      successThreshold: 1
      failureThreshold: 18
      periodSeconds: 10
      timeoutSeconds: 5
      exec:
        command:
        - sh
        - -c
        - wget -q -T 10 -t 2 127.0.0.1:9999 && echo 0 || echo 1
    livenessProbe:
      successThreshold: 1
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5
      exec:
        command:
        - sh
        - -c
        - wget -q -T 10 -t 2 127.0.0.1:9999 && echo 0 || echo 1
    readinessProbe:
      successThreshold: 2
      failureThreshold: 2
      periodSeconds: 10
      timeoutSeconds: 5
      exec:
        command:
        - sh
        - -c
        - wget -q -T 10 -t 2 127.0.0.1:9999 && echo 0 || echo 1
    env:
    - name: VPN_SERVICE_PROVIDER
      value: "private internet access"
    - name: OPENVPN_FLAGS
      value: "--fast-io --sndbuf 1024000 --rcvbuf 1024000 --compress"
    - name: OPENVPN_CIPHERS
      value: "aes-128-cbc"
    - name: OPENVPN_USER
      valueFrom:
        secretKeyRef:
          name: pia-credentials
          key: PIA_USERNAME
    - name: OPENVPN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pia-credentials
          key: PIA_PASSWORD
    - name: SERVER_REGIONS
      value: "CA Montreal"
    - name: PORT_FORWARD_ONLY
      value: "true"
    - name: VPN_PORT_FORWARDING
      value: "on"
    - name: VPN_PORT_FORWARDING_STATUS_FILE
      value: "/gluetun/forwarded_port.txt"
    ports:
    - containerPort: 8000
      name: gluetun
    volumeMounts:
    - name: port-forward
      mountPath: /gluetun
  - name: ping
    image: docker.io/busybox:stable
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
        - NET_ADMIN
      privileged: false
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
    command:
    - sh
    - -c
    - |
      while ! ping -c 1 google.com; do
        echo "Ping failed, retrying in 5"
        sleep 5
      done
      echo "ping successful, exiting"
  - name: update-peer-port
    image: docker.io/busybox:stable
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsUser: 911
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
    command:
    - sh
    - -c
    - |
      while [ ! -f "/gluetun/forwarded_port.txt" ]; do
        echo "Waiting for port forward..."
        sleep 5
      done
      cp /tmp/settings.json /config/settings.json
      export FORWARDED_PORT="$(cat /gluetun/forwarded_port.txt)"
      sed -i "s/\"peer-port\":.*/\"peer-port\": $FORWARDED_PORT,/g" /config/settings.json
      echo "transmission port updated to $FORWARDED_PORT"
      cat /config/settings.json
    volumeMounts:
    - name: transmission-configmap
      mountPath: /tmp/settings.json
      subPath: settings.json
      readOnly: true
    - name: port-forward
      mountPath: /gluetun
    - name: config
      mountPath: /config
dnsPolicy: "None"
dnsConfig:
  nameservers:
  - 127.0.0.1
containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: true
  capabilities:
    drop:
    - ALL
    add:
    - CHOWN
    - SETUID
    - SETGID
  seccompProfile:
    type: RuntimeDefault
podAntiAffinity: true
podSecurityContext: {} # gluetun needs root access to make changes to network settings
imageUpdater:
  enabled: true
configMap:
  enabled: true
  valueFile: transmission-configmap.yaml
prometheusRules:
  enabled: true
  rules:
  - alert: GluetunNotReady
    expr: up{container="gluetun"} == 0
    for: 2m
    labels:
      severity: critical
      component: transmission
      namespace: monitoring
    annotations:
      summary: "Gluetun VPN container is down"
      description: "The Gluetun VPN container has been down for 2+ minutes."
  - alert: GluetunPortNotForwarded
    expr: up{container="gluetun"} < 1
    for: 5m
    labels:
      severity: warning
      component: transmission
      namespace: monitoring
    annotations:
      summary: "VPN port not forwarded"
      description: "The Gluetun VPN container is not reporting as up."
  - alert: TransmissionStaleTorrents
    expr: transmission_stalled_torrents > 10
    for: 30m
    labels:
      severity: warning
      component: transmission
      namespace: monitoring
    annotations:
      summary: "{{ $value }} stalled torrents"
      description: "There are more than 10 stalled torrents for 30+ minutes."
externalSecrets:
- name: pia-credentials
  data:
  - secretKey: PIA_USERNAME
    remoteRef:
      key: /homelab/transmission/PIA_USERNAME
  - secretKey: PIA_PASSWORD
    remoteRef:
      key: /homelab/transmission/PIA_PASSWORD
